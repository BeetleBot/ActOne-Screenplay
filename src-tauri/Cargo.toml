[package]
name = "actone"
version = "0.4.18"
description = "An open-source Fountain screenplay editor for Windows and Linux"
authors = ["iyal.ink"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "actone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.14"
base64 = "0.22"
krilla = "0.7.0"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
bitflags = "2"
cosmic-text = "0.12.1"
unicode-properties = "0.1"
font-kit = "0.14"
zip = "2"
dunce = "1.0"
tauri-plugin-clipboard-manager = "~2.0"
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }
tauri-plugin-http = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
sysinfo = "0.35"
futures-util = "0.3"
spellbook = "0.4"
regex = "1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Services_Store", "Foundation"] }
pollster = "0.4"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
strip = "symbols"

