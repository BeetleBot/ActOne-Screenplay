app-id: ink.iyal.actone
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: actone

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: bzip2
    buildsystem: simple
    build-commands:
      - make -f Makefile-libbz2_so
      - install -Dm755 libbz2.so.1.0.8 /app/lib/libbz2.so.1.0.8
      - ln -sf libbz2.so.1.0.8 /app/lib/libbz2.so.1.0
      - ln -sf libbz2.so.1.0.8 /app/lib/libbz2.so.1
    sources:
      - type: archive
        url: https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
        sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269

  - name: actone
    buildsystem: simple
    build-commands:
      - install -Dm755 actone /app/bin/actone
      - install -Dm644 ink.iyal.actone.desktop /app/share/applications/ink.iyal.actone.desktop
      - install -Dm644 ink.iyal.actone.metainfo.xml /app/share/metainfo/ink.iyal.actone.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/128x128/apps/ink.iyal.actone.png
    sources:
      - type: file
        path: ../src-tauri/target/release/actone
      - type: file
        path: ink.iyal.actone.desktop
      - type: file
        path: ink.iyal.actone.metainfo.xml
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: icon.png

