app-id: ink.iyal.actone
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: actone

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=host-fonts
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Desktop

modules:
  - name: actone
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/share/actone/actone /app/bin/actone
      - install -Dm644 ink.iyal.actone.desktop /app/share/applications/ink.iyal.actone.desktop
      - install -Dm644 ink.iyal.actone.metainfo.xml /app/share/metainfo/ink.iyal.actone.metainfo.xml
      - install -Dm644 usr/share/actone/icon_app/actone_icon_128x128.png /app/share/icons/hicolor/128x128/apps/ink.iyal.actone.png
    sources:
      - type: archive
        url: https://downloads.iyal.ink/ActOne-Linux-x64-0.4.12.tar.gz
        sha256: 92e5d6dd1b50e922ae616d64437a8f0373ff11e8cb6b229c9f83398494a58423
      - type: file
        path: ink.iyal.actone.desktop
      - type: file
        path: ink.iyal.actone.metainfo.xml
