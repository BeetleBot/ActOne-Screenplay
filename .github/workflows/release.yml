name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n '/^## \[/{p; :a; n; /^## \[/q; p; ba}' CHANGELOG.md > LATEST_CHANGELOG.md
          else
            echo "Release ${{ github.ref_name }}" > LATEST_CHANGELOG.md
          fi
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ActOne ${{ github.ref_name }}
          body_path: LATEST_CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux (${{ matrix.archive }})
    needs: [create-release]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: ActOne-Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Tauri app
        run: npm run tauri build
      - name: Package portable tarball
        run: |
          mkdir -p portable/usr/share/actone/icon_app
          mkdir -p portable/usr/share/applications
          mkdir -p portable/usr/share/mime/packages
          
          cp src-tauri/target/release/actone portable/usr/share/actone/
          cp assets/linux/actone.desktop portable/usr/share/applications/
          cp assets/linux/actone.xml portable/usr/share/mime/packages/
          
          for size in 16 32 64 128 256 512; do
            if [ -f "src-tauri/icons/${size}x${size}.png" ]; then
              cp "src-tauri/icons/${size}x${size}.png" "portable/usr/share/actone/icon_app/actone_icon_${size}x${size}.png"
            fi
          done
          
          cp assets/linux/install.sh portable/
          cp assets/linux/uninstall.sh portable/
          chmod +x portable/install.sh portable/uninstall.sh
          
          tar -czf ${{ matrix.archive }}.tar.gz -C portable .
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            ${{ matrix.archive }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64
    needs: [create-release]
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Tauri app
        run: npm run tauri build
      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force
          Copy-Item src-tauri/target/release/actone.exe portable/
          Compress-Archive -Path portable/* -DestinationPath ActOne-Windows-x64.zip
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            ActOne-Windows-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
