name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest test suite
        run: npm test

  backend:
    name: Rust Backend Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect exported PDF layout
        run: npm run test:pdf-layout

  desktop:
    name: Desktop lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev libdbus-1-dev libfontconfig1-dev pkg-config webkit2gtk-driver xvfb
      - run: npm ci
      - name: Cache desktop drivers
        id: drivers
        uses: actions/cache@v4
        with:
          path: node_modules/.desktop-tools
          key: desktop-driver-${{ runner.os }}-2.1.0
      - name: Install Tauri driver
        if: steps.drivers.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked --root node_modules/.desktop-tools
      - name: Match the Windows WebView driver
        if: runner.os == 'Windows'
        run: python tests/desktop/install_edge_driver.py
      - name: Build isolated desktop test app
        run: npm run build:desktop-test
      - name: Native lifecycle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
      - name: Native lifecycle (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Upload desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-failure-${{ runner.os }}
          path: node_modules/.desktop-results
          if-no-files-found: ignore
