name: Build Linux (AppImage & Flatpak)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.4.24). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-bundle:
    name: Build Tauri Binary
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' package.json | head -1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building binary for version: $VERSION"

      - name: Build frontend and compile Tauri binary
        run: npm run tauri build -- --no-bundle

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/actone
          retention-days: 1

  package-appimage:
    name: Package AppImage
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/

      - name: Package AppImage
        env:
          VERSION: ${{ needs.build-bundle.outputs.version }}
        run: |
          chmod +x src-tauri/target/release/actone
          BUILD_DIR="target/appimage-build"
          APPDIR="$BUILD_DIR/AppDir"
          ARTIFACTS_DIR="Release/artifacts"

          rm -rf "$BUILD_DIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/mime/packages"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/64x64/mimetypes"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/mimetypes"

          cp src-tauri/target/release/actone "$APPDIR/usr/bin/actone"
          chmod +x "$APPDIR/usr/bin/actone"

          cp assets/linux/actone.desktop "$APPDIR/usr/share/applications/actone.desktop"
          cp assets/linux/actone.desktop "$APPDIR/actone.desktop"
          cp assets/linux/actone.xml "$APPDIR/usr/share/mime/packages/actone.xml"

          if [ -f src-tauri/icons/128x128.png ]; then
            cp src-tauri/icons/128x128.png "$APPDIR/usr/share/icons/hicolor/128x128/apps/actone.png"
          fi
          if [ -f src-tauri/icons/128x128@2x.png ]; then
            cp src-tauri/icons/128x128@2x.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/actone.png"
          fi

          for mime in text-vnd.fountain application-vnd.actone.bundle application-vnd.actone.theme; do
            if [ -f "src-tauri/icons/${mime}_64x64.png" ]; then
              cp "src-tauri/icons/${mime}_64x64.png" "$APPDIR/usr/share/icons/hicolor/64x64/mimetypes/${mime}.png"
            fi
            if [ -f "src-tauri/icons/${mime}_256x256.png" ]; then
              cp "src-tauri/icons/${mime}_256x256.png" "$APPDIR/usr/share/icons/hicolor/256x256/mimetypes/${mime}.png"
            fi
          done

          cp src-tauri/icons/128x128.png "$APPDIR/actone.png"
          cp src-tauri/icons/128x128.png "$APPDIR/.DirIcon"

          cat << 'APP_RUN' > "$APPDIR/AppRun"
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}

          export PATH="${HERE}/usr/bin:${PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${HERE}/usr/bin/actone" "$@"
          APP_RUN
          chmod +x "$APPDIR/AppRun"

          APPIMAGETOOL="$BUILD_DIR/appimagetool"
          curl -fsSL -o "$APPIMAGETOOL" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$APPIMAGETOOL"

          mkdir -p "$ARTIFACTS_DIR"
          APPIMAGE_NAME="ActOne-Screenplay-x86_64-$VERSION.AppImage"
          OUTPUT_FILE="$ARTIFACTS_DIR/$APPIMAGE_NAME"

          echo "==> Generating AppImage: $APPIMAGE_NAME"
          ARCH=x86_64 "$APPIMAGETOOL" "$APPDIR" "$OUTPUT_FILE"

      - name: Upload AppImage artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-AppImage-x86_64
          path: Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage
          retention-days: 30

      - name: Upload AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          TAG_NAME="v$VERSION"
          APPIMAGE_FILE=$(ls Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage | head -1)

          gh release create "$TAG_NAME" "$APPIMAGE_FILE" --title "ActOne Screenplay v$VERSION" --notes "ActOne Screenplay v$VERSION Release assets." || \
          gh release upload "$TAG_NAME" "$APPIMAGE_FILE" --clobber

  package-flatpak:
    name: Package Flatpak
    needs: build-bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /__w/ActOne-Screenplay/ActOne-Screenplay

      - name: Download compiled Tauri binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: flatpak/

      - name: Make binary executable and stage flatpak resources
        run: |
          chmod +x flatpak/actone
          cp assets/linux/actone.xml flatpak/
          cp src-tauri/icons/128x128.png flatpak/icon_128.png
          cp src-tauri/icons/128x128@2x.png flatpak/icon_256.png

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ink.iyal.actone.flatpak
          manifest-path: flatpak/ink.iyal.actone.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Prepare bundle with versioned name
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          cp ink.iyal.actone.flatpak "ActOne-Screenplay-x86_64-${VERSION}.flatpak"

      - name: Upload Flatpak artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-Flatpak-x86_64
          path: ActOne-Screenplay-x86_64-*.flatpak
          retention-days: 30

      - name: Upload Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          TAG_NAME="v$VERSION"
          FLATPAK_FILE=$(ls ActOne-Screenplay-x86_64-*.flatpak | head -1)

          gh release create "$TAG_NAME" "$FLATPAK_FILE" --title "ActOne Screenplay v$VERSION" --notes "ActOne Screenplay v$VERSION Release assets." || \
          gh release upload "$TAG_NAME" "$FLATPAK_FILE" --clobber
