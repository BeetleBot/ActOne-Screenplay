name: Build Linux (AppImage & Flatpak)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.4.24). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-bundle:
    name: Build Tauri Binary
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' package.json | head -1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building binary for version: $VERSION"

      - name: Build frontend and compile Tauri binary
        run: npm run tauri build -- --no-bundle

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/actone
          retention-days: 1

  package-appimage:
    name: Package AppImage
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            file \
            xvfb \
            xdotool \
            xauth \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-1 \
            librsvg2-dev \
            libsoup-3.0-0 \
            libjavascriptcoregtk-4.1-dev

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/

      - name: Setup Node.js for packaging
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install packaging tools
        run: npm ci

      - name: Package and verify AppImage
        env:
          VERSION: ${{ needs.build-bundle.outputs.version }}
          APPIMAGE_SMOKE_TEST: '1'
        run: bash Release/appimage/package-appimage.sh

      - name: Upload AppImage artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-AppImage-x86_64
          path: Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage
          retention-days: 30

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1].replace(/^v/, "");
            let changelog = "";
            try { changelog = fs.readFileSync("CHANGELOG.md", "utf8"); } catch (e) {}
            const lines = changelog.split(/\r?\n/);
            let inSection = false;
            const extracted = [];
            const targetHeader = "## [" + version + "]";
            for (const line of lines) {
              if (line.startsWith(targetHeader)) {
                inSection = true;
                continue;
              }
              if (inSection && line.startsWith("## [")) {
                break;
              }
              if (inSection) {
                extracted.push(line);
              }
            }
            const notes = extracted.join("\n").trim() || `ActOne Screenplay v${version} release assets.`;
            fs.writeFileSync("RELEASE_NOTES.md", notes + "\n");
          ' "$VERSION"

      - name: Upload AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          TAG_NAME="v$VERSION"
          APPIMAGE_FILE=$(ls Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage | head -1)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "ActOne Screenplay v$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG_NAME" "$APPIMAGE_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$APPIMAGE_FILE" --title "ActOne Screenplay v$VERSION" --notes-file RELEASE_NOTES.md
          fi

  package-flatpak:
    name: Package Flatpak
    needs: build-bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /__w/ActOne-Screenplay/ActOne-Screenplay

      - name: Download compiled Tauri binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: flatpak/

      - name: Make binary executable and stage flatpak resources
        run: |
          chmod +x flatpak/actone
          cp assets/linux/actone.xml flatpak/
          cp src-tauri/icons/128x128.png flatpak/icon_128.png
          cp src-tauri/icons/128x128@2x.png flatpak/icon_256.png

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ink.iyal.actone.flatpak
          manifest-path: flatpak/ink.iyal.actone.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Prepare bundle with versioned name
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          cp ink.iyal.actone.flatpak "ActOne-Screenplay-x86_64-${VERSION}.flatpak"

      - name: Upload Flatpak artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-Flatpak-x86_64
          path: ActOne-Screenplay-x86_64-*.flatpak
          retention-days: 30

      - name: Extract Release Notes from Changelog
        id: notes
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1].replace(/^v/, "");
            let changelog = "";
            try { changelog = fs.readFileSync("CHANGELOG.md", "utf8"); } catch (e) {}
            const lines = changelog.split(/\r?\n/);
            let inSection = false;
            const extracted = [];
            const targetHeader = "## [" + version + "]";
            for (const line of lines) {
              if (line.startsWith(targetHeader)) {
                inSection = true;
                continue;
              }
              if (inSection && line.startsWith("## [")) {
                break;
              }
              if (inSection) {
                extracted.push(line);
              }
            }
            const notes = extracted.join("\n").trim() || `ActOne Screenplay v${version} release assets.`;
            fs.writeFileSync("RELEASE_NOTES.md", notes + "\n");
          ' "$VERSION"

      - name: Upload Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          TAG_NAME="v$VERSION"
          FLATPAK_FILE=$(ls ActOne-Screenplay-x86_64-*.flatpak | head -1)

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "ActOne Screenplay v$VERSION" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG_NAME" "$FLATPAK_FILE" --clobber
          else
            gh release create "$TAG_NAME" "$FLATPAK_FILE" --title "ActOne Screenplay v$VERSION" --notes-file RELEASE_NOTES.md
          fi

  publish-flatpak-repository:
    name: Sign and publish Flatpak repository
    needs: [build-bundle, package-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: actone-flatpak-repository
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://6a2606ac3d2c7b841572db244af34b20.r2.cloudflarestorage.com
      R2_BUCKET: actone-flatpak
      FLATPAK_REPOSITORY_URL: https://flatpak.iyal.ink/repo
      GNUPGHOME: /tmp/actone-flatpak-signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
          command -v aws

      - name: Download this workflow's Flatpak
        uses: actions/download-artifact@v4
        with:
          name: ActOne-Screenplay-Flatpak-x86_64
          path: ${{ runner.temp }}/bundle

      - name: Restore published repository
        run: |
          mkdir -p "$RUNNER_TEMP/flatpak-site/repo"
          aws s3 sync "s3://$R2_BUCKET/repo/" "$RUNNER_TEMP/flatpak-site/repo/" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Sign and validate repository
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
          RELEASE_VERSION: ${{ needs.build-bundle.outputs.version }}
        run: |
          BUNDLE="$RUNNER_TEMP/bundle/ActOne-Screenplay-x86_64-$RELEASE_VERSION.flatpak"
          bash scripts/sign-flatpak-repository.sh "$BUNDLE" "$RUNNER_TEMP/flatpak-site"

      - name: Upload repository objects before advertising the update
        run: |
          # Publish images before clients see metadata that references them.
          aws s3 sync "$RUNNER_TEMP/flatpak-site/screenshots/" "s3://$R2_BUCKET/screenshots/" \
            --endpoint-url "$R2_ENDPOINT" --cache-control 'public,max-age=86400' --only-show-errors
          # Keep old objects so clients downloading an earlier version can finish.
          aws s3 sync "$RUNNER_TEMP/flatpak-site/repo/" "s3://$R2_BUCKET/repo/" \
            --endpoint-url "$R2_ENDPOINT" --exclude 'summary*' \
            --cache-control 'no-cache' --only-show-errors
          aws s3 cp "$RUNNER_TEMP/flatpak-site/repo/" "s3://$R2_BUCKET/repo/" \
            --endpoint-url "$R2_ENDPOINT" --recursive --exclude '*' --include 'summary*' \
            --cache-control 'no-cache' --only-show-errors
          for FILE in actone.flatpakrepo actone.flatpakref actone.gpg actone.png; do
            aws s3 cp "$RUNNER_TEMP/flatpak-site/$FILE" "s3://$R2_BUCKET/$FILE" \
              --endpoint-url "$R2_ENDPOINT" --cache-control 'no-cache' --only-show-errors
          done

      - name: Check public installation link
        run: |
          curl --fail --retry 5 --retry-all-errors --retry-delay 5 \
            https://flatpak.iyal.ink/actone.flatpakref --output "$RUNNER_TEMP/published.flatpakref"
          cmp "$RUNNER_TEMP/flatpak-site/actone.flatpakref" "$RUNNER_TEMP/published.flatpakref"
          echo 'Install: flatpak install --user https://flatpak.iyal.ink/actone.flatpakref' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -d "$GNUPGHOME" ]; then
            gpgconf --kill all || true
            rm -rf "$GNUPGHOME"
          fi
