name: Windows MSIX Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-msix:
    name: Build MSIX Package
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (release)
        run: npm run tauri build -- --no-bundle

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          }
          echo "SEMVER=$ver" >> $env:GITHUB_OUTPUT
          echo "MSIX_VER=$ver.0" >> $env:GITHUB_OUTPUT

      - name: Stamp version into manifest
        shell: pwsh
        run: |
          $xml = [xml](Get-Content packaging/msix/AppxManifest.xml)
          $xml.Package.Identity.Version = "${{ steps.version.outputs.MSIX_VER }}"
          $xml.Save("packaging/msix/AppxManifest.xml")

      - name: Prepare package layout
        shell: pwsh
        run: |
          $layout = "target/msix/layout"
          New-Item -ItemType Directory -Path "$layout/Assets" -Force | Out-Null

          Copy-Item src-tauri/target/release/actone.exe $layout/
          Copy-Item packaging/msix/AppxManifest.xml $layout/

          Copy-Item src-tauri/icons/StoreLogo.png "$layout/Assets/"
          Copy-Item src-tauri/icons/Square44x44Logo.png "$layout/Assets/"
          Copy-Item src-tauri/icons/Square150x150Logo.png "$layout/Assets/"
          Copy-Item src-tauri/icons/Wide310x150Logo.png "$layout/Assets/"
          Copy-Item src-tauri/icons/Square310x310Logo.png "$layout/Assets/"

      - name: Create MSIX
        shell: pwsh
        run: |
          $sdkDir = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdkDir.FullName "x64\MakeAppx.exe"
          $filename = if ("${{ github.ref_type }}" -eq "tag") { "ActOne-${{ steps.version.outputs.SEMVER }}.msix" } else { "ActOne-TEST-BUILD.msix" }
          & $makeappx pack /d target/msix/layout /p "target/msix/$filename" /o
          echo "FILENAME=$filename" >> $env:GITHUB_ENV

      - name: Upload to Release (Tag)
        uses: softprops/action-gh-release@v2
        with:
          files: target/msix/${{ env.FILENAME }}
          token: ${{ secrets.GITHUB_TOKEN }}
