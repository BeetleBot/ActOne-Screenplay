name: Linux Tarball Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-tarball:
    name: Linux Tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (release)
        run: npm run tauri build

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ver="${{ github.ref_name }}"
            ver="${ver#v}"
          else
            ver=$(grep -oP '^version = "\K[^"]+' src-tauri/Cargo.toml)
          fi
          echo "SEMVER=$ver" >> $GITHUB_OUTPUT

      - name: Package tarball
        run: |
          ver="${{ steps.version.outputs.SEMVER }}"
          mkdir -p tarball/usr/share/actone/icon_app
          mkdir -p tarball/usr/share/applications
          mkdir -p tarball/usr/share/mime/packages
          
          cp src-tauri/target/release/actone tarball/usr/share/actone/
          cp assets/linux/actone.desktop tarball/usr/share/applications/
          cp assets/linux/actone.xml tarball/usr/share/mime/packages/
          
          for size in 16 32 64 128 256 512; do
            if [ -f "src-tauri/icons/${size}x${size}.png" ]; then
              cp "src-tauri/icons/${size}x${size}.png" "tarball/usr/share/actone/icon_app/actone_icon_${size}x${size}.png"
            fi
          done
          
          cp assets/linux/install.sh tarball/
          cp assets/linux/uninstall.sh tarball/
          chmod +x tarball/install.sh tarball/uninstall.sh
          
          tar -czf ActOne-Linux-x64-$ver.tar.gz -C tarball .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ActOne-Linux-x64-${{ steps.version.outputs.SEMVER }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
