# Manual Windows Build Workflow
# Builds a Tauri v2 application for Windows producing an NSIS installer and portable executable.
# Triggered only manually via workflow_dispatch — no release creation, no publishing.

on:
  # Only allow manual triggering from the GitHub Actions UI or API
  workflow_dispatch:

jobs:
  build:
    name: Build Windows (NSIS)
    runs-on: windows-latest

    # Statically link the C runtime to avoid needing VC++ redistributable on target machines
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      # Check out the repository so we have access to the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the latest stable Rust toolchain (compiler + cargo)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache Rust/Cargo dependencies (registry, git repos, build artifacts)
      # This significantly speeds up subsequent builds
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Set up Node.js LTS and configure npm caching based on package-lock.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # Install npm dependencies using package-lock.json for deterministic installs
      - name: Install npm dependencies
        run: npm ci

      # Build the Tauri application in release mode
      # This compiles the Rust backend, builds the frontend (Vite/TypeScript),
      # and runs the Tauri bundler to produce the NSIS installer
      - name: Build Tauri app (release)
        run: npm run tauri build

      # Upload the NSIS installer (.exe) produced by the Tauri bundler
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-NSIS-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0  # Installers are already compressed

      # Upload the standalone portable executable (no installer, just the .exe)
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Portable
          path: src-tauri/target/release/actone.exe
          compression-level: 0
