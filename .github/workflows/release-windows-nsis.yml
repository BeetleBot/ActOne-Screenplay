name: Windows NSIS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nsis:
    name: Build NSIS Installer + Portable
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (release, no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          }
          echo "SEMVER=$ver" >> $env:GITHUB_OUTPUT

      - name: Create NSIS and MSI installers
        run: npm run tauri bundle -- --bundles nsis,msi

      - name: Prepare portable binary
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.SEMVER }}"
          Copy-Item src-tauri/target/release/actone.exe "src-tauri/target/release/ActOne-Portable-x64-$ver.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/ActOne-Portable-x64-${{ steps.version.outputs.SEMVER }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}

