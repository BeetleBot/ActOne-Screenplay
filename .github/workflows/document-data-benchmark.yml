name: Document data benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/performance/**'
      - 'scripts/benchmark-document-data.mjs'
      - 'package*.json'
      - '.github/workflows/document-data-benchmark.yml'
  push:
    branches: [main, master]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify cache correctness and lifecycle
        run: npx vitest run src/document src/hooks/useDocumentPagination.test.ts src/context/SearchContext.test.tsx src/hooks/useFontManager.test.ts
      - name: Measure shared calculations
        run: npm run benchmark:document-data -- ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-data-${{ matrix.os }}-${{ github.run_id }}
          path: output/benchmarks/
          retention-days: 30
