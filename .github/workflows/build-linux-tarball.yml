name: Build Linux Tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux-tarball:
    name: Build Linux Tarball (.tar.gz)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Package Linux tarball
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          
          TARBALL_DIR="target/tarball"
          mkdir -p "$TARBALL_DIR/usr/share/actone/icon_app"
          mkdir -p "$TARBALL_DIR/usr/share/actone/icon_mime"
          mkdir -p "$TARBALL_DIR/usr/share/applications"
          mkdir -p "$TARBALL_DIR/usr/share/mime/packages"

          cp src-tauri/target/release/actone "$TARBALL_DIR/usr/share/actone/"
          cp assets/linux/actone.desktop "$TARBALL_DIR/usr/share/applications/"
          cp assets/linux/actone.xml "$TARBALL_DIR/usr/share/mime/packages/"

          for size in 16 32 64 128 256 512; do
              icon="src-tauri/icons/${size}x${size}.png"
              if [ -f "$icon" ]; then
                  cp "$icon" "$TARBALL_DIR/usr/share/actone/icon_app/actone_icon_${size}x${size}.png"
              fi
          done

          for size in 64 256; do
              for mime in text-vnd.fountain application-vnd.actone.bundle application-vnd.actone.theme; do
                  icon="src-tauri/icons/${mime}_${size}x${size}.png"
                  if [ -f "$icon" ]; then
                      cp "$icon" "$TARBALL_DIR/usr/share/actone/icon_mime/"
                  fi
              done
          done

          cp assets/linux/install.sh "$TARBALL_DIR/"
          cp assets/linux/uninstall.sh "$TARBALL_DIR/"
          cp assets/linux/readme.txt "$TARBALL_DIR/"
          chmod +x "$TARBALL_DIR/install.sh" "$TARBALL_DIR/uninstall.sh"

          mkdir -p Release/artifacts
          TARBALL_FILE="ActOne-Linux-x64-${VERSION}.tar.gz"
          cd "$TARBALL_DIR"
          tar -czf "../../Release/artifacts/${TARBALL_FILE}" .

      - name: Upload Artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          TAG_NAME="v${VERSION}"
          
          gh release create "$TAG_NAME" Release/artifacts/*.tar.gz \
            --title "ActOne v${VERSION}" \
            --notes "ActOne v${VERSION} Release assets." || gh release upload "$TAG_NAME" Release/artifacts/*.tar.gz --clobber

      - name: Trigger Flathub Repository Update
        env:
          FLATHUB_PAT: ${{ secrets.FLATHUB_PAT }}
        if: ${{ env.FLATHUB_PAT != '' }}
        run: |

          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          
          URL="https://github.com/iyal-ink/ActOne-Screenplay/releases/download/v${VERSION}/ActOne-Linux-x64-${VERSION}.tar.gz"
          SHA256=$(sha256sum Release/artifacts/*.tar.gz | awk '{print $1}')
          DATE=$(date +%Y-%m-%d)

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${{ secrets.FLATHUB_PAT }}@github.com/flathub/ink.iyal.actone.git flathub-repo || git clone https://x-access-token:${{ secrets.FLATHUB_PAT }}@github.com/BeetleBot/ink.iyal.actone.git flathub-repo
          cd flathub-repo

          sed -i "s|url: .*|url: $URL|g" ink.iyal.actone.yml
          sed -i "s|sha256: .*|sha256: $SHA256|g" ink.iyal.actone.yml
          sed -i "s|<release version=\".*\" date=\".*\"|<release version=\"$VERSION\" date=\"$DATE\"|g" ink.iyal.actone.metainfo.xml

          git add ink.iyal.actone.yml ink.iyal.actone.metainfo.xml
          git commit -m "Update to v${VERSION}"
          git push origin main || git push origin master


