name: Build Flatpak Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-binary:
    name: Build Tauri Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri binary
        run: npm run tauri build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/actone
          retention-days: 1

  package-flatpak:
    name: Package Flatpak Bundle (.flatpak)
    needs: build-binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Tauri binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/

      - name: Make binary executable
        run: chmod +x src-tauri/target/release/actone

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ActOne-x86_64.flatpak
          manifest-path: flatpak/ink.iyal.actone.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Upload Flatpak to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          TAG_NAME="v${VERSION}"

          gh release create "$TAG_NAME" ActOne-x86_64.flatpak \
            --title "ActOne v${VERSION}" \
            --notes "ActOne v${VERSION} Release assets." || \
          gh release upload "$TAG_NAME" ActOne-x86_64.flatpak --clobber
