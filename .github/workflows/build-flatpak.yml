name: Build Flatpak Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.12)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak Bundle (.flatpak)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            flatpak flatpak-builder

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri binary
        run: npm run tauri build

      - name: Setup Flatpak Runtime & Build Bundle
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          
          cd flatpak
          flatpak-builder --force-clean --repo=repo build-dir ink.iyal.actone.yml
          flatpak build-bundle repo ActOne-x86_64.flatpak ink.iyal.actone

      - name: Upload Flatpak Artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          TAG_NAME="v${VERSION}"
          
          gh release create "$TAG_NAME" flatpak/ActOne-x86_64.flatpak \
            --title "ActOne v${VERSION}" \
            --notes "ActOne v${VERSION} Release assets." || gh release upload "$TAG_NAME" flatpak/ActOne-x86_64.flatpak --clobber
