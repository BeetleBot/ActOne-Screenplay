name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.5.1). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-bundle:
    name: Build Tauri Binary
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || grep -oP '"version":\s*"\K[^"]+' package.json | head -1)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building binary for version: $VERSION"

      - name: Build frontend and compile Tauri binary
        run: npm run tauri build -- --no-bundle

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/actone
          retention-days: 1

  package-appimage:
    name: Package AppImage
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            file \
            xvfb \
            xdotool \
            xauth \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-1 \
            librsvg2-dev \
            libsoup-3.0-0 \
            libjavascriptcoregtk-4.1-dev

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/

      - name: Setup Node.js for packaging
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install packaging tools
        run: npm ci

      - name: Package and verify AppImage
        env:
          VERSION: ${{ needs.build-bundle.outputs.version }}
          APPIMAGE_SMOKE_TEST: '1'
        run: bash Release/appimage/package-appimage.sh

      - name: Upload AppImage artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-AppImage-x86_64
          path: Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage
          retention-days: 30

      - name: Upload AppImage to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          TAG_NAME="v$VERSION"
          APPIMAGE_FILE=$(ls Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage | head -1)

          gh release create "$TAG_NAME" "$APPIMAGE_FILE" --title "ActOne Screenplay v$VERSION" --notes "ActOne Screenplay v$VERSION Release assets." || \
          gh release upload "$TAG_NAME" "$APPIMAGE_FILE" --clobber
