name: Windows Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-store:
    name: Build MSIX + NSIS for Store
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build Tauri app (release, no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          }
          echo "SEMVER=$ver" >> $env:GITHUB_OUTPUT

      - name: Configure MSIX signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          if ($env:PFX_BASE64) {
            $pfxBytes = [Convert]::FromBase64String($env:PFX_BASE64)
            $pfxPath = "${{ runner.temp }}\signing.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            $config = Get-Content src-tauri/gen/windows/bundle.config.json -Raw | ConvertFrom-Json
            $config.signing.pfx = $pfxPath
            $config.signing.pfxPassword = $env:PFX_PASSWORD
            $config | ConvertTo-Json -Depth 10 | Set-Content src-tauri/gen/windows/bundle.config.json
            Write-Host "MSIX signing configured with certificate"
          } else {
            Write-Host "No signing certificate found - MSIX will be unsigned (Store will sign it during ingestion)"
          }

      - name: Create NSIS, MSI, and MSIX bundles
        run: npm run tauri bundle -- --bundles nsis,msi,msix

      - name: Prepare portable binary
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.SEMVER }}"
          Copy-Item src-tauri/target/release/actone.exe "src-tauri/target/release/ActOne-Portable-x64-$ver.exe"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/ActOne-Portable-x64-${{ steps.version.outputs.SEMVER }}.exe
          token: ${{ secrets.GITHUB_TOKEN }}
