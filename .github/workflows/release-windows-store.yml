name: Windows Store Release (NSIS + MSIX)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (NSIS + MSIX)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app (release, no bundle)
        run: npm run tauri build -- --no-bundle

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v',''
          } else {
            $ver = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          }
          echo "SEMVER=$ver" >> $env:GITHUB_OUTPUT

      - name: Create NSIS installer
        run: npm run tauri bundle -- --bundles nsis

      - name: Prepare portable binary
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.SEMVER }}"
          Copy-Item src-tauri/target/release/actone.exe "src-tauri/target/release/ActOne-Portable-x64-$ver.exe"

      - name: Install WinAppCli
        uses: microsoft/setup-WinAppCli@v1

      - name: Stage MSIX package folder
        shell: pwsh
        run: |
          $stageDir = "msix-staging"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          New-Item -ItemType Directory -Path "$stageDir/Assets" -Force | Out-Null

          Copy-Item winapp/Package.appxmanifest "$stageDir/"
          Copy-Item src-tauri/target/release/actone.exe "$stageDir/"

          Copy-Item src-tauri/icons/StoreLogo.png "$stageDir/Assets/"
          Copy-Item src-tauri/icons/Square44x44Logo.png "$stageDir/Assets/"
          Copy-Item src-tauri/icons/Square150x150Logo.png "$stageDir/Assets/"
          Copy-Item src-tauri/icons/Wide310x150Logo.png "$stageDir/Assets/"
          Copy-Item src-tauri/icons/Square310x310Logo.png "$stageDir/Assets/"

      - name: Create MSIX via WinApp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/msix -Force | Out-Null
          winapp pack ./msix-staging --output target/msix/ActOne.msix

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/ActOne-Portable-x64-${{ steps.version.outputs.SEMVER }}.exe
            target/msix/*.msix
          token: ${{ secrets.GITHUB_TOKEN }}
