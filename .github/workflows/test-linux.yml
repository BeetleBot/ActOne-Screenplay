name: Test Linux Build (Artifacts Only)

run-name: Linux test build · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      format:
        description: 'Build format'
        required: true
        type: choice
        default: both
        options:
          - both
          - appimage
          - flatpak

permissions:
  contents: read

jobs:
  build-bundle:
    if: github.ref_type == 'branch'
    name: Build Tauri Binary
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Determine version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building binary for version: $VERSION"

      - name: Build frontend and compile Tauri binary
        run: npm run tauri build -- --no-bundle

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/actone
          retention-days: 1

  package-appimage:
    name: Package AppImage
    if: inputs.format == 'both' || inputs.format == 'appimage'
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            patchelf \
            file \
            xvfb \
            xdotool \
            xauth \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-1 \
            librsvg2-dev \
            libsoup-3.0-0 \
            libjavascriptcoregtk-4.1-dev

      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: src-tauri/target/release/

      - name: Setup Node.js for packaging
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install packaging tools
        run: npm ci

      - name: Package and verify AppImage
        env:
          VERSION: ${{ needs.build-bundle.outputs.version }}
          APPIMAGE_SMOKE_TEST: '1'
        run: bash Release/appimage/package-appimage.sh

      - name: Upload AppImage artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-AppImage-x86_64
          path: Release/artifacts/ActOne-Screenplay-x86_64-*.AppImage
          retention-days: 30

  package-flatpak:
    name: Package Flatpak
    if: inputs.format == 'both' || inputs.format == 'flatpak'
    needs: build-bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          set-safe-directory: true

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory '*'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /__w/ActOne-Screenplay/ActOne-Screenplay

      - name: Download compiled Tauri binary
        uses: actions/download-artifact@v4
        with:
          name: actone-binary
          path: flatpak/

      - name: Make binary executable and stage flatpak resources
        run: |
          chmod +x flatpak/actone
          cp assets/linux/actone.xml flatpak/
          cp src-tauri/icons/128x128.png flatpak/icon_128.png
          cp src-tauri/icons/128x128@2x.png flatpak/icon_256.png

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ink.iyal.actone.flatpak
          manifest-path: flatpak/ink.iyal.actone.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Prepare bundle with versioned name
        run: |
          VERSION="${{ needs.build-bundle.outputs.version }}"
          cp ink.iyal.actone.flatpak "ActOne-Screenplay-x86_64-${VERSION}.flatpak"

      - name: Upload Flatpak artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: ActOne-Screenplay-Flatpak-x86_64
          path: ActOne-Screenplay-x86_64-*.flatpak
          retention-days: 30
